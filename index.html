<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pet lineup: blocky 3D</title>
<style>
:root{--bg:#f3f3f7;--fg:#1b1b26;--mut:#5e5e74;--line:#cfcfdc;--chip:#e4e4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f17;--fg:#ececf6;--mut:#9a9ab4;--line:#34344a;--chip:#22222f}}
:root[data-theme="dark"]{--bg:#0f0f17;--fg:#ececf6;--mut:#9a9ab4;--line:#34344a;--chip:#22222f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
p{margin:0 0 12px;color:var(--mut);font-size:14px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid #7c8cff;outline-offset:2px}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#st{height:clamp(320px,62vw,440px);border-radius:12px;overflow:hidden;touch-action:none;cursor:grab;background:#12121c}
#st canvas{display:block;width:100%;height:100%}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 8px}
#nm{font-size:18px;font-weight:600;margin-right:4px}
.c{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.d{width:9px;height:9px;border-radius:2px}
#ctl{display:flex;gap:8px}
</style></head><body><div class="w">
<h1>Pet lineup</h1>
<p>Drag to rotate, scroll or pinch to zoom.</p>
<div id="tabs"></div>
<div id="st" role="img" aria-label="Interactive 3D model of the selected pet"></div>
<div id="info"><span id="nm"></span><span id="ch"></span></div>
<div id="ctl"><button id="sp" aria-pressed="true">Auto-spin: on</button><button id="rs">Reset view</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const RC={Common:'#9ca3af',Rare:'#3b82f6',Epic:'#a855f7',Legendary:'#f59e0b'};

{n:'Sprout',r:'Common',e:'Nature',c:'#4ade80',

{n:'Cinder',r:'Common',e:'Fire',c:'#fb923c',
p:[[1.5,1.1,2.2,0,1.1,0,'#e8622c'],[1.5,1.3,1.3,0,2.15,1.1,'#f2753a'],[.2,.15,.1,0,2,1.77,'#3a1608'],[.35,1.6,.35,0,1.9,-1.3,'#ff8a3d'],[.5,.5,.5,0,2.9,-1.3,'#ffd166',1],[.15,.15,.15,1,.2,-1,'#ffd166',1],[.15,.15,.15,-.8,.5,-1.6,'#ffd166',1]],
s:[[.4,.5,.3,.5,3,1,'#e8622c'],[.2,.3,.1,.5,2.95,1.17,'#ffb27a'],[.25,.3,.1,.38,2.3,1.77,'#ffd166',1],[.45,.6,.45,.5,.3,.8,'#c94f1f'],[.45,.6,.45,.5,.3,-.8,'#c94f1f']]},
{n:'Chillby',r:'Common',e:'Ice',c:'#60a5fa',
p:[[1.8,2.2,1.4,0,1.5,0,'#2a5fc4'],[1.2,1.7,.2,0,1.4,.7,'#bfe3ff',.5],[1.5,1.2,1.4,0,3.2,0,'#2a5fc4'],[.5,.25,.4,0,3.05,.8,'#ffb347'],[.3,.5,.3,0,4.05,0,'#7dd3fc',1]],
s:[[.35,.35,.1,.4,3.35,.72,'#fff'],[.15,.15,.1,.4,3.35,.78,'#111'],[.3,1.3,.7,1.05,1.6,0,'#1f4aa0'],[.7,.2,.9,.45,.1,.3,'#ffb347'],[.25,.35,.25,.35,4,0,'#7dd3fc',1]]},
{n:'Voltail',r:'Rare',e:'Lightning',c:'#facc15',
p:[[1.4,1.1,2.4,0,1.3,0,'#f2b705'],[1.3,1.1,1.2,0,2.3,1.3,'#f7c52a'],[.6,.5,.6,0,2.1,2,'#fff3b0'],[.25,.2,.15,0,2.2,2.35,'#15151f']],
s:[[.35,.7,.3,.4,3.1,1.2,'#f2b705'],[.35,.25,.3,.4,3.5,1.2,'#15151f'],[.2,.2,.1,.35,2.45,1.92,'#15151f'],[.4,.9,.4,.45,.45,.8,'#c99400'],[.4,.9,.4,.45,.45,-.8,'#c99400'],[.35,.35,.8,.4,1.7,-1.6,'#fde047',1],[.35,.8,.35,.7,2.1,-2,'#fde047',1],[.35,.35,.8,.95,2.5,-2.4,'#fde047',1]]},
{n:'Nyx',r:'Rare',e:'Void',ride:1,c:'#a855f7',
p:[[1.8,1.6,3.6,0,2.2,0,'#3b1d6e'],[1.5,1.3,1.5,0,3.3,2.1,'#4b2688'],[.8,.6,.6,0,3.1,3,'#2a1450'],[1.5,.25,1.3,0,3.12,0,'#c084fc',.8],[1.6,1,.4,0,3.6,1.2,'#a855f7',.8],[.4,.4,1.2,0,2.6,-2.4,'#3b1d6e'],[.4,1.2,.4,0,3.2,-3,'#3b1d6e'],[.55,.55,.55,0,3.95,-3,'#c084fc',1]],
s:[[.6,1.5,.6,.65,.75,1.2,'#2a1450'],[.6,1.5,.6,.65,.75,-1.2,'#2a1450'],[.3,.2,.1,.45,3.5,2.88,'#e9d5ff',1],[.4,.5,.3,.5,4.15,1.9,'#4b2688'],[.5,.1,.5,.6,.05,-3.5,'#a855f7',1]]},
{n:'Nebulon',r:'Epic',e:'Cosmic',c:'#818cf8',f:1,
p:[[2.4,2,4,0,2.6,0,'#3b3fa8'],[2,.6,3.4,0,1.75,.1,'#6c72e8'],[2.2,1.8,1.4,0,2.6,2.5,'#3b3fa8'],[1.8,1.4,.6,0,2.5,3.5,'#4a4fc4'],[1.4,1.2,1.6,0,2.8,-2.6,'#4a4fc4'],[3,.25,1,0,3,-3.8,'#4a4fc4'],[.3,.1,.3,0,3.65,1.5,'#7dd3fc',1],[.2,.2,.2,-.6,3.65,0,'#fde68a',1],[.2,.2,.2,.5,3.65,-.8,'#7dd3fc',1],[.2,.2,.2,-1,.8,-1,'#7dd3fc',1],[.2,.2,.2,1.2,.5,.5,'#fde68a',1],[.2,.2,.2,-.4,1,2.2,'#a5b4fc',1],[.2,.2,.2,.9,.9,-3,'#7dd3fc',1]],
s:[[.1,.3,.3,1.12,2.9,2.8,'#e0f2fe'],[.1,.15,.15,1.15,2.9,2.85,'#15151f'],[.3,.3,1,1.4,2.1,.8,'#4a4fc4']]},
{n:'Solaris',r:'Legendary',e:'Holy',ride:1,c:'#fbbf24',
p:[[2,1.8,3.4,0,2.8,0,'#e0a31a'],[1.6,1.2,.2,0,2.8,1.8,'#fff6d6',.6],[1.7,1.5,1.6,0,4.2,1.9,'#f5c542'],[2.6,2.4,.8,0,4.2,1.2,'#fde68a'],[.6,.5,.7,0,3.95,2.9,'#b7791f'],[1.7,.25,1.4,0,3.82,-.2,'#fff6d6'],[.4,.4,1.4,0,2.9,-2.3,'#e0a31a'],[.6,.6,.6,0,2.9,-3.2,'#fde68a',1],[2.4,.2,.2,0,7,1.2,'#fff1b8',1],[2.4,.2,.2,0,5.8,1.2,'#fff1b8',1]],
s:[[.7,1.8,.7,.7,.9,1.2,'#b7791f'],[.7,1.8,.7,.7,.9,-1.2,'#b7791f'],[.3,.3,.1,.45,4.4,2.72,'#7c4a03'],[.35,.4,.3,.6,5.1,1.8,'#f5c542'],[.2,1.2,.2,1.2,6.4,1.2,'#fff1b8',1],[.3,1.4,2.2,1.5,4,-.2,'#fff1b8',.4],[.3,1.4,1.8,2,4.5,-.4,'#fff1b8',.4],[.3,1.3,1.4,2.5,5,-.6,'#fff1b8',.4],[.3,1.2,1,3,5.5,-.8,'#fff1b8',.4]]}
];
function mat(c,g){const k=new T.Color(c);k.offsetHSL(0,0,(Math.random()-.5)*.05);const m=new T.MeshStandardMaterial({color:k,roughness:.75,metalness:.05});if(g){m.emissive=new T.Color(c);m.emissiveIntensity=g}return m}
function mk(p){const g=new T.Group();const add=(a,f)=>{const m=new T.Mesh(new T.BoxGeometry(a[0],a[1],a[2]),mat(a[6],a[7]));m.position.set(f?-a[3]:a[3],a[4],a[5]);m.castShadow=m.receiveShadow=true;g.add(m)};p.p.forEach(a=>add(a));p.s.forEach(a=>{add(a);add(a,1)});return g}
const st=document.getElementById('st');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;st.appendChild(R.domElement);
const sc=new T.Scene();sc.background=new T.Color('#12121c');
const cam=new T.PerspectiveCamera(38,1,.1,100);
sc.add(new T.HemisphereLight('#cfd8ff','#2a2438',.9));
const dl=new T.DirectionalLight('#ffffff',.9);dl.position.set(5,9,6);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-6,right:6,top:6,bottom:-6});sc.add(dl);
const pl=new T.PointLight('#ffffff',1.3,18);pl.position.set(0,1.6,5);sc.add(pl);
const fl=new T.Mesh(new T.CircleGeometry(3.6,48),new T.MeshStandardMaterial({color:'#1c1c2a',roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
const rg=new T.Mesh(new T.RingGeometry(3.4,3.6,64),new T.MeshBasicMaterial({color:'#ffffff'}));rg.rotation.x=-Math.PI/2;rg.position.y=.01;sc.add(rg);
const hold=new T.Group();sc.add(hold);
let cur,pet,base=0,ry=.6,rx=.2,d=13,spin=true,drag=0,pd=0;
const tabs=document.getElementById('tabs');
PETS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n;b.onclick=()=>pick(i);tabs.appendChild(b)});
function pick(i){cur=PETS[i];if(pet)hold.remove(pet);pet=mk(cur);const k=5.4/(()=>{const s=new T.Box3().setFromObject(pet).getSize(new T.Vector3());return Math.max(s.x,s.y,s.z)})();pet.scale.setScalar(k);pet.updateMatrixWorld(true);const b=new T.Box3().setFromObject(pet),c=b.getCenter(new T.Vector3());pet.position.set(-c.x,-b.min.y,-c.z);base=pet.position.y;hold.add(pet);
rg.material.color.set(cur.c);pl.color.set(cur.c);
[...tabs.children].forEach((x,j)=>x.classList.toggle('on',j==i));
document.getElementById('nm').textContent=cur.n;
document.getElementById('ch').innerHTML='<span class="c"><span class="d" style="background:'+RC[cur.r]+'"></span>'+cur.r+'</span> <span class="c"><span class="d" style="background:'+cur.c+'"></span>'+cur.e+'</span> <span class="c">'+(cur.ride?'Rideable':'Companion')+'</span>'}
function clamp(v){return Math.min(20,Math.max(7,v))}
st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);drag=1;st.style.cursor='grabbing'};
const ps=new Map();
st.onpointermove=e=>{if(!ps.has(e.pointerId))return;const o=ps.get(e.pointerId);if(ps.size==1){ry+=(e.clientX-o[0])*.01;rx=Math.min(1.1,Math.max(.02,rx+(e.clientY-o[1])*.005))}ps.set(e.pointerId,[e.clientX,e.clientY]);if(ps.size==2){const a=[...ps.values()],q=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)d=clamp(d*pd/q);pd=q}};
st.onpointerup=st.onpointercancel=e=>{ps.delete(e.pointerId);pd=0;if(!ps.size){drag=0;st.style.cursor='grab'}};
st.addEventListener('wheel',e=>{e.preventDefault();d=clamp(d*(1+e.deltaY*.001))},{passive:false});
const sp=document.getElementById('sp');
sp.onclick=()=>{spin=!spin;sp.textContent='Auto-spin: '+(spin?'on':'off');sp.setAttribute('aria-pressed',spin)};
document.getElementById('rs').onclick=()=>{ry=.6;rx=.2;d=13;spin=true;sp.textContent='Auto-spin: on';sp.setAttribute('aria-pressed',true)};
function rsz(){const w=st.clientWidth,h=st.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
window.addEventListener('resize',rsz);rsz();
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){requestAnimationFrame(loop);if(spin&&!drag&&!rm)ry+=.006;hold.rotation.y=ry;if(cur.f&&!rm)pet.position.y=base+Math.sin(t/600)*.2;cam.position.set(0,2.4+Math.sin(rx)*d,Math.cos(rx)*d);cam.lookAt(0,2.2,0);R.render(sc,cam)}
pick(0);requestAnimationFrame(loop);
</script></body></html>
